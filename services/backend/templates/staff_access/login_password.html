{% extends "staff_access/auth_base.html" %}

{% block staff_auth_content %}
<form method="post" class="staff-form" novalidate>
  {% csrf_token %}
  {% include "staff_access/form_fields.html" %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  <button type="submit" class="staff-button staff-button--primary">Continue</button>
</form>
<p class="staff-auth__note">If two-factor authentication is enabled, your code is requested on the next screen.</p>
{% endblock %}
