{% if form.non_field_errors %}
<div class="staff-form__errors" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="staff-form__field{% if field.errors %} staff-form__field--error{% endif %}">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="staff-form__errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
