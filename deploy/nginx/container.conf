map $http_x_forwarded_proto $frekuence_original_scheme {
    default http;
    http http;
    https https;
}

map $frekuence_original_scheme $frekuence_forwarded_port {
    http 80;
    https 443;
}

map $http_x_forwarded_for $frekuence_client_address {
    default $remote_addr;
    "~^\d{1,3}(?:\.\d{1,3}){3}$" $http_x_forwarded_for;
    "~^[0-9A-Fa-f:.]*:[0-9A-Fa-f:.]*$" $http_x_forwarded_for;
}

map $frekuence_original_scheme $frekuence_hsts {
    default "";
    https "max-age=31536000";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $frekuence_frontend_origin http://web:8080;
    set $frekuence_backend_origin http://backend:8000;

    client_max_body_size 1m;
    client_body_timeout 15s;
    send_timeout 35s;
    keepalive_timeout 15s;

    proxy_connect_timeout 5s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;
    proxy_http_version 1.1;
    proxy_intercept_errors off;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $frekuence_original_scheme;
    proxy_set_header X-Forwarded-Port $frekuence_forwarded_port;
    proxy_set_header X-Forwarded-For $frekuence_client_address;
    proxy_set_header X-Real-IP $frekuence_client_address;
    proxy_set_header Forwarded "";
    proxy_set_header X-CSP-Nonce "";
    proxy_set_header Content-Security-Policy "";
    proxy_set_header Connection "";

    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Strict-Transport-Security;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security $frekuence_hsts always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $frekuence_hsts always;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        proxy_pass $frekuence_backend_origin;
    }

    location = /staff {
        return 308 /staff/;
    }

    location ^~ /staff/ {
        client_max_body_size 16m;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $frekuence_hsts always;
        proxy_pass $frekuence_backend_origin;
    }

    location ^~ /static/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        root /srv;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $frekuence_hsts always;
        access_log off;
    }

    location ^~ /media/events/derivatives/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        root /srv;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $frekuence_hsts always;
        access_log off;
    }

    location ^~ /media/ {
        return 404;
    }

    location ^~ /_astro/ {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Strict-Transport-Security $frekuence_hsts always;
        proxy_pass $frekuence_frontend_origin;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        proxy_pass $frekuence_frontend_origin;
    }
}
